[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dima", email = "fdu11287@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]


[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []